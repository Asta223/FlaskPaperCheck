{% extends 'base.html' %}
{% block title %}回收站 - 工厂管理系统{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-trash3"></i> 回收站</h4>
    <a href="{{ url_for('system.operation_logs') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-clock-history"></i> 操作日志
    </a>
</div>
<p class="text-muted small">
    已删除的数据不会在业务页面显示，记录仍保留在数据库中。管理员可在此恢复误删数据；恢复时会重新校验唯一性和库存。
</p>

<form method="get" class="row g-2 align-items-center mb-3">
    <div class="col-auto">
        <label for="type" class="col-form-label col-form-label-sm">数据类型</label>
    </div>
    <div class="col-auto">
        <select id="type" name="type" class="form-select form-select-sm" onchange="this.form.submit()">
            <option value="">全部（共 {{ rows|length }} 条）</option>
            {% for key, cfg in registry.items() %}
            <option value="{{ key }}" {% if type_key == key %}selected{% endif %}>
                {{ cfg[1] }}（{{ counts[key] }}）
            </option>
            {% endfor %}
        </select>
    </div>
</form>

<div class="table-responsive">
    <table class="table table-sm table-hover align-middle bg-white">
        <thead class="table-light">
        <tr>
            <th>类型</th>
            <th>记录</th>
            <th class="text-end">操作</th>
        </tr>
        </thead>
        <tbody>
        {% for row in rows %}
        <tr>
            <td class="text-nowrap">{{ row.label }}</td>
            <td>{{ row.desc }} <span class="text-muted">#{{ row.id }}</span></td>
            <td class="text-end">
                <form method="post" class="d-inline"
                      action="{{ url_for('system.recycle_restore', type_key=row.type, obj_id=row.id) }}"
                      onsubmit="return confirm('确认恢复这条记录？');">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-sm btn-outline-success">
                        <i class="bi bi-arrow-counterclockwise"></i> 恢复
                    </button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="3" class="text-center text-muted py-4">回收站为空</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
