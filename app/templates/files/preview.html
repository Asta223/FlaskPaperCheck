{% extends "base.html" %}
{% block title %}预览 {{ file_rec.name }} - 工厂管理系统{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0"><i class="bi bi-eye"></i> {{ file_rec.name }}</h5>
    <div>
        <a class="btn btn-outline-primary" href="{{ url_for('files.download', file_id=file_rec.id) }}"><i class="bi bi-download"></i> 下载</a>
        <a class="btn btn-outline-secondary" href="javascript:window.close()">关闭</a>
    </div>
</div>
<div class="card shadow-sm">
    <div class="card-body text-center bg-light">
        {% set ext = file_rec.file_ext|lower %}
        {% if ext == '.pdf' %}
            <iframe src="{{ preview_url }}" width="100%" height="720px" style="border:none;"></iframe>
        {% else %}
            <img src="{{ preview_url }}" alt="{{ file_rec.name }}" class="img-fluid" style="max-height:80vh;">
        {% endif %}
    </div>
</div>
{% endblock %}
