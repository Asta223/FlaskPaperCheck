{% extends "base.html" %}
{% block content %}
    <div class="jumbotron">
        <h1 class="display-4">欢迎使用课程报告查重系统</h1>
        <p class="lead">本系统基于 Flask 开发，支持 PDF、Word、TXT 格式上传，采用 TF-IDF 算法进行相似度检测。</p>
        <hr class="my-4">
        <p>请登录后上传课程报告进行查重。</p>
        {% if not current_user.is_authenticated %}
            <a class="btn btn-primary btn-lg" href="{{ url_for('auth.login') }}" role="button">登录</a>
            <a class="btn btn-secondary btn-lg" href="{{ url_for('auth.register') }}" role="button">注册</a>
        {% else %}
            <a class="btn btn-primary btn-lg" href="{{ url_for('paper.upload') }}" role="button">开始查重</a>
        {% endif %}
    </div>
{% endblock %}
